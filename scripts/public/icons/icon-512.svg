<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="112.64" fill="#2563eb"/>
  
  <!-- Eye drop bottle body -->
